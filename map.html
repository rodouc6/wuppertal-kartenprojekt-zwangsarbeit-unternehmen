<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Zwangsarbeit Wuppertal – Karte &amp; Unternehmen</title>

<link rel="stylesheet" href="vendor/leaflet-1.9.4/leaflet.css" />
<script src="vendor/leaflet-1.9.4/leaflet.js"></script>
<link rel="stylesheet" href="style.css" />

</head>
<body class="kartenseite">

<nav>
  <a href="index.html">Startseite</a>
  <a href="map.html" class="active">Karte</a>
  <span class="nav-dropdown">
    <a href="about.html">Projekt &#9662;</a>
    <span class="nav-dropdown-menu">
      <a href="about.html">Über das Projekt</a>
      <a href="about/bibliographie.html">Bibliographie</a>
      <a href="about/statistiken.html">Statistiken</a>
    </span>
  </span>
  <a href="impressum.html">Impressum</a>
</nav>

<div id="layout">
  <div id="map-panel">
    <div id="map"></div>
    <!-- Huelle um Schild und Pille: sie traegt die Positionierung, damit die
         Meldezahl ueber der Pille schweben kann, statt sie zu sprengen. Im
         Quelltext steht das Schild vor dem Panel -- so steht es auch optisch
         und in der Vorlesereihenfolge. -->
    <div id="timeline-wrap">
      <span id="timeline-meldungen" hidden></span>
      <div id="timeline-panel">
        <button id="timeline-play" title="Abspielen / Pause">&#9654;</button>
        <input type="range" id="timeline-slider" min="0" max="0" value="0" step="1">
        <span id="timeline-date">—</span>
        <div id="timeline-mode" role="group" aria-label="Zählweise">
          <button
            type="button"
            data-modus="stichtag"
            aria-pressed="false"
            title="Nur die Zahlen, die für diesen Tag überliefert sind."
          >Stichtag</button>
          <button
            type="button"
            data-modus="fortgeschrieben"
            aria-pressed="true"
            title="Visualisiert wird hier unter der Annahme, dass die Mitteilungen zum Stichtag in der Folgezeit stabil waren."
          >Fortgeschrieben</button>
        </div>
      </div>
    </div>
  </div>
  <div id="sidebar">
    <div id="sidebar-header">
      <!-- Eigener Button statt role="button" auf dem ganzen Header: der
           Header enthaelt bereits den echten #filter-toggle-Button, ein
           role="button" auf dem Header selbst waere button > button
           (siehe map-app.js, initSidebarToggle). Nur auf schmalen Schirmen
           sichtbar -- oberhalb der 760px-Schwelle bleibt das Attribut
           "hidden" gesetzt (js/map-app.js schaltet es per matchMedia um). -->
      <button
        id="griff-anfasser"
        class="griff-anfasser"
        hidden
        aria-label="Liste der Unternehmen ein- oder ausklappen"
        aria-expanded="true"
        title="Liste ein- oder ausklappen"
      ></button>
      <h2>Unternehmen</h2>
      <small id="entry-count"></small>
      <button id="filter-toggle" title="Filter ein-/ausblenden">Filter ▾</button>
    </div>
    <div id="suche-zeile">
      <label class="visuell-verborgen" for="suche">Unternehmen, Adresse oder Nummer suchen</label>
      <input
        type="search"
        id="suche"
        placeholder="Name, Adresse, Nummer …"
        autocomplete="off"
        spellcheck="false"
      >
      <button id="suche-loeschen" type="button" hidden aria-label="Suche löschen">&times;</button>
    </div>
    <div id="filter-panel" class="filter-panel hidden">
      <div class="filter-group">
        <label class="filter-label">Industriezweig</label>
        <div class="filter-dropdown" id="filter-industriezweig">
          <button class="dropdown-btn" data-target="dd-industriezweig">Alle <span class="dd-arrow">▾</span></button>
          <div class="dropdown-list" id="dd-industriezweig"></div>
        </div>
      </div>
      <div class="filter-group">
        <label class="filter-label">ZA-Art</label>
        <div class="filter-dropdown" id="filter-zaart">
          <button class="dropdown-btn" data-target="dd-zaart">Alle <span class="dd-arrow">▾</span></button>
          <div class="dropdown-list" id="dd-zaart"></div>
        </div>
      </div>
      <div class="filter-group">
        <label class="filter-label">Geschlecht</label>
        <div class="filter-btn-group">
          <button class="filter-btn" data-gender="m">Männlich</button>
          <button class="filter-btn" data-gender="w">Weiblich</button>
        </div>
      </div>
      <div class="filter-group">
        <label class="filter-label">Stadtteil</label>
        <div class="filter-dropdown" id="filter-stadtteil">
          <button class="dropdown-btn" data-target="dd-stadtteil">Alle <span class="dd-arrow">▾</span></button>
          <div class="dropdown-list" id="dd-stadtteil"></div>
        </div>
      </div>
      <div class="filter-group">
        <label class="filter-label">Mindestzahl ZA</label>
        <input type="number" id="filter-mindestzahl" min="0" value="" placeholder="z. B. 50">
      </div>
      <div class="filter-actions">
        <button id="filter-reset">Zurücksetzen</button>
        <span id="filter-status"></span>
      </div>
    </div>
    <div id="entries-container">
      <p class="loading-msg">Daten werden geladen …</p>
    </div>
  </div>
  <button id="sidebar-toggle" title="Sidebar ausblenden">&#9654;</button>
</div>

<div id="quellen-overlay" class="quellen-overlay" hidden>
  <div class="quellen-dialog" role="dialog" aria-modal="true" aria-labelledby="quellen-titel">
    <div class="quellen-kopf">
      <div>
        <div class="quellen-label">Quellen nach Speer (2003)</div>
        <h3 id="quellen-titel" class="quellen-name"></h3>
        <div id="quellen-beleg" class="quellen-beleg"></div>
      </div>
      <button id="quellen-schliessen" class="quellen-schliessen" title="Schließen" aria-label="Schließen">&#10005;</button>
    </div>
    <div id="quellen-text" class="quellen-text" tabindex="0"></div>
  </div>
</div>

<script src="js/daten.js"></script>
<script src="js/branchen.js"></script>
<script src="js/map-app.js"></script>
<script src="js/nav.js"></script>
</body>
</html>
